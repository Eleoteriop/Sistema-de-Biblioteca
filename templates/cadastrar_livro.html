<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar livro</title>
</head>

<body>

    <h1>Cadastrar livro</h1>

    <form action="/cadastrar_livro" method="post">

        <label for="titulo">Título</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            required
        >

        <br><br>

        <label for="autor">Autor</label>
        <input
            type="text"
            id="autor"
            name="autor"
            required
        >

        <br><br>

        <label for="ano">Ano</label>
        <input
            type="number"
            id="ano"
            name="ano"
            required
        >

        <br><br>

        <label for="isbn">ISBN</label>
        <input
            type="text"
            id="isbn"
            name="isbn"
            required
        >

        <br><br>

        <label for="categoria">Categoria</label>
        <input
            type="text"
            id="categoria"
            name="categoria"
            required
        >

        <br><br>

        <label for="qtd">Quantidade</label>
        <input
            type="number"
            id="qtd"
            name="qtd"
            min="1"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar livro
        </button>

    </form>

    <br>

    <a href="/livros">Voltar para livros</a>

</body>

</html>
